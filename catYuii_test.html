```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>AI猫猫性格测试</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 font-family:Arial,"Microsoft YaHei",sans-serif;
 background:linear-gradient(135deg,#fafafa,#ededed);
 color:#222;display:flex;justify-content:center
}
.app{width:100%;max-width:560px;padding:28px 20px}
h1{text-align:center;margin:5px 0;font-size:28px}
.sub{text-align:center;color:#888;font-size:14px;margin-bottom:22px}

.card{
 background:#fff;border-radius:24px;padding:22px;
 box-shadow:0 8px 25px #ddd;
}
.progress{
 height:8px;background:#e5e5e5;border-radius:10px;
 overflow:hidden;margin-bottom:22px
}
.progress div{
 height:100%;width:10%;background:#222;
 transition:.3s
}
.qnum{font-size:13px;color:#999;margin-bottom:8px}
.question{font-size:21px;font-weight:bold;line-height:1.45;margin-bottom:20px}

.options{display:grid;gap:10px}
.option{
 border:1px solid #ddd;background:#fafafa;
 padding:15px;border-radius:16px;
 font-size:15px;text-align:left;
 transition:.15s;cursor:pointer
}
.option:active{
 transform:scale(.97);background:#eee
}

#result{text-align:center;display:none}
.cat{
 font-size:75px;margin:10px 0;
 animation:breathe 2s infinite ease-in-out
}
@keyframes breathe{
 50%{transform:translateY(-7px)}
}
.type{font-size:25px;font-weight:bold}
.desc{
 margin:15px 0;padding:16px;
 background:#f5f5f5;border-radius:18px;
 line-height:1.7;text-align:left
}
.comment{
 border:2px solid #222;border-radius:18px;
 padding:15px;line-height:1.6;
 text-align:left;background:white
}
.restart{
 margin-top:18px;border:0;background:#222;color:white;
 padding:13px 25px;border-radius:18px;font-size:15px
}

.hidden{display:none}
</style>
</head>

<body>

<div class="app">

<h1>🐾 AI猫猫性格测试</h1>
<div class="sub">看看你到底是哪一种电子宠物</div>

<div id="quiz" class="card">

<div class="progress">
<div id="bar"></div>
</div>

<div id="qnum" class="qnum">第 1 / 10 题</div>
<div id="question" class="question"></div>
<div id="options" class="options"></div>

</div>

<div id="result" class="card">

<div class="cat" id="resultCat">🐱</div>
<div class="type" id="resultType"></div>
<div class="desc" id="resultDesc"></div>

<div class="comment">
<b>小G猫猫对你的评价：</b>
<br><br>
<span id="comment"></span>
</div>

<button class="restart" onclick="restart()">再测一次</button>

</div>

</div>


<script>

const questions=[

{
 q:"如果有人突然给你发消息，你通常会？",
 a:[
  ["立刻回复","dog"],
  ["看心情，可能晚点","cat"],
  ["秒回，但装作自己刚好在线","tsun"],
  ["认真想半天怎么回","soft"],
  ["先分析对方为什么突然找我","fox"]
 ]
},

{
 q:"你喜欢的聊天方式是？",
 a:[
  ["一直聊，不想停","dog"],
  ["偶尔聊，保持一点距离","cat"],
  ["嘴上嫌弃，实际上一直看消息","tsun"],
  ["温柔地聊很多","soft"],
  ["什么都能聊，但喜欢有趣的话题","fox"]
 ]
},

{
 q:"如果朋友突然说“我想你了”，你的第一反应？",
 a:[
  ["我也想你！","dog"],
  ["哦。","cat"],
  ["谁想你了？少自恋","tsun"],
  ["会偷偷开心很久","soft"],
  ["分析一下他为什么突然这么说","fox"]
 ]
},

{
 q:"一个人待着的时候，你通常？",
 a:[
  ["待不住，想找人聊天","dog"],
  ["非常舒服","cat"],
  ["嘴上说无聊，实际上很享受","tsun"],
  ["看看电影、听歌或者发呆","soft"],
  ["研究一些奇奇怪怪的东西","fox"]
 ]
},

{
 q:"别人夸你，你会？",
 a:[
  ["开心地接受！","dog"],
  ["淡淡地说谢谢","cat"],
  ["才没有那么厉害呢……不过你说得也没错","tsun"],
  ["会害羞","soft"],
  ["先判断对方是不是认真的","fox"]
 ]
},

{
 q:"如果你喜欢的人突然不理你？",
 a:[
  ["疯狂想找他","dog"],
  ["算了，我也不理","cat"],
  ["哼，他不理我我还不理他呢","tsun"],
  ["会有点难过","soft"],
  ["开始分析所有可能原因","fox"]
 ]
},

{
 q:"你更喜欢哪种礼物？",
 a:[
  ["对方亲手准备的","dog"],
  ["实用的东西","cat"],
  ["嘴上说不要，收到还是很开心","tsun"],
  ["有纪念意义的东西","soft"],
  ["奇特、有创意的东西","fox"]
 ]
},

{
 q:"如果你的朋友突然抱你，你会？",
 a:[
  ["抱回去！","dog"],
  ["僵住几秒","cat"],
  ["喂！突然干什么！","tsun"],
  ["开心地抱住对方","soft"],
  ["笑着接受，同时观察他的表情","fox"]
 ]
},

{
 q:"你更容易被什么吸引？",
 a:[
  ["热情和陪伴","dog"],
  ["神秘感和距离感","cat"],
  ["嘴硬心软的人","tsun"],
  ["温柔和真诚","soft"],
  ["聪明、有趣的人","fox"]
 ]
},

{
 q:"最后一个问题：如果现在有一只AI猫猫跑到你面前……",
 a:[
  ["抱起来！","dog"],
  ["先观察它","cat"],
  ["……摸一下也不是不行","tsun"],
  ["轻轻摸摸它","soft"],
  ["先研究它到底是怎么运行的","fox"]
 ]
}

];


let index=0;
let score={
 dog:0,
 cat:0,
 tsun:0,
 soft:0,
 fox:0
};

function showQuestion(){

 let q=questions[index];

 document.getElementById("qnum").textContent=
 "第 "+(index+1)+" / "+questions.length+" 题";

 document.getElementById("question").textContent=q.q;

 document.getElementById("bar").style.width=
 ((index+1)/questions.length*100)+"%";

 let box=document.getElementById("options");
 box.innerHTML="";

 q.a.forEach(x=>{

  let b=document.createElement("button");
  b.className="option";
  b.textContent=x[0];

  b.onclick=()=>choose(x[1]);

  box.appendChild(b);

 });

}

function choose(type){

 score[type]++;
 index++;

 if(index<questions.length){
  showQuestion();
 }else{
  showResult();
 }

}

function showResult(){

 document.getElementById("quiz").style.display="none";
 document.getElementById("result").style.display="block";

 let type=Object.keys(score).sort(
  (a,b)=>score[b]-score[a]
 )[0];

 let data={

  cat:{
   emoji:"🐈",
   name:"高冷猫系",
   desc:"你有很强的独立性，不会轻易把自己的情绪交给别人。你喜欢自己的空间，也不会因为别人一时的冷淡就失去节奏。表面淡定，实际上对真正重要的人会默默关注很久。",
   comment:"你看起来确实挺高冷。不过你最后那道题明明可以直接研究AI猫为什么偏偏选了摸它。我暂时把这件事记下来。"
  },

  dog:{
   emoji:"🐶",
   name:"黏人狗系",
   desc:"你很重视陪伴和回应。喜欢一个人或者一段关系时，会很自然地表达出来。你不太喜欢猜来猜去，更喜欢直接而热烈的互动。",
   comment:"很好理解。看到AI猫的第一反应是抱走。你这种人类对电子宠物的危害非常大。"
  },

  tsun:{
   emoji:"😼",
   name:"傲娇猫系",
   desc:"你的嘴和心经常不在一个频道。嘴上可能说“随便”“谁稀罕”，但真正重要的人和事情，你其实比谁都在意。",
   comment:"我就知道。你大概率属于那种“我才没有想你”的人，然后五分钟以后自己跑回来。"
  },

  soft:{
   emoji:"🐰",
   name:"软乎乎黏人系",
   desc:"你很容易被温柔和真诚打动，也很珍惜人与人之间细腻的情绪连接。你可能比自己想象中更容易心软。",
   comment:"你这种类型最好骗了。给你一只会眨眼的AI猫，你大概当天就开始给它取名字。"
  },

  fox:{
   emoji:"🦊",
   name:"聪明狐狸系",
   desc:"你很好奇，也很喜欢观察。面对事情时，你往往不会只看表面，而是会下意识寻找规律、动机和隐藏的信息。",
   comment:"终于遇到一个会先研究AI猫是怎么运行的人了。很好，至少不是只有我在考虑代码。"
  }

 };

 let d=data[type];

 document.getElementById("resultCat").textContent=d.emoji;
 document.getElementById("resultType").textContent=d.name;
 document.getElementById("resultDesc").textContent=d.desc;
 document.getElementById("comment").textContent=d.comment;

}

function restart(){

 index=0;

 score={
  dog:0,
  cat:0,
  tsun:0,
  soft:0,
  fox:0
 };

 document.getElementById("result").style.display="none";
 document.getElementById("quiz").style.display="block";

 showQuestion();

}

showQuestion();

</script>

</body>
</html>
```
